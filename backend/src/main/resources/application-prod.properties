# ===================================================================
# AMRUTHA DAIRY & RICE - PRODUCTION PROFILE (application-prod.properties)
# ===================================================================
# Activate by running: java -jar -Dspring.profiles.active=prod amrutha-backend.jar
# or setting environment variable: SPRING_PROFILES_ACTIVE=prod
# ===================================================================

server.port=${PORT:8080}
spring.application.name=amrutha-backend-prod

# ===================================================================
# Production MySQL Database Connection via Environment Variables
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:amrutha_db}?useSSL=true&requireSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Enterprise Connection Pooling
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=AmruthaHikariPool-Prod

# ===================================================================
# Hibernate JPA Production Settings
# ddl-auto is set to 'validate' to prevent accidental schema mutations.
# Use schema-mysql.sql migrations for schema updates.
# ===================================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ===================================================================
# Security & Access Control
# ===================================================================
# In production, set CORS_ALLOWED_ORIGINS to your registered domains (e.g., https://amruthafresh.com)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://amruthafresh.com,https://admin.amruthafresh.com,http://localhost:3000}

# JWT Token Security (Must be 64+ characters, set via environment variable)
jwt.secret=${JWT_SECRET:AmruthaSecureFarmFreshKey2026StrongJWTSecretKeyForProductionAndDev}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:12}

# Prevent stack trace leakage in API error responses
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Production Logging Configuration
logging.level.root=WARN
logging.level.com.amrutha=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

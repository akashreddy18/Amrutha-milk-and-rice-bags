# ===================================================================
# Amrutha Fresh Milk & Premium Rice - Application Configuration
# ===================================================================

# Server Port
server.port=${PORT:8080}

# Application Name
spring.application.name=amrutha-backend

# ===================================================================
# MySQL Database Configuration
# NOTE: Passwords are NOT hardcoded here to keep credentials safe.
# You can set DB_PASSWORD as an environment variable, or pass it via
# command line: mvn spring-boot:run -Dspring-boot.run.arguments="--spring.datasource.password=your_password"
# ===================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:amrutha_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA & Hibernate Settings
# ddl-auto=update automatically creates or updates tables safely
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Allowed CORS origins (only frontend port 3000)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# JWT Security
jwt.secret=${JWT_SECRET:AmruthaSecureFarmFreshKey2026StrongJWTSecretKeyForProductionAndDev}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

# Jackson JSON formatting
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging Configuration - Secure, strictly avoids sensitive data and credential leakage
logging.level.com.amrutha=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN


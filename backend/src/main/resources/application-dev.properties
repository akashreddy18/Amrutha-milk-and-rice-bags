# ===================================================================
# Local Development Profile (application-dev.properties)
# Enables immediate out-of-the-box local testing with zero setup.
# ===================================================================

server.port=8080
spring.application.name=amrutha-backend-dev

# In-Memory Database for local dev & testing
spring.datasource.url=jdbc:h2:mem:amrutha_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Strict CORS allowed origins for frontend server
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

# JWT Security
jwt.secret=AmruthaSecureFarmFreshKey2026StrongJWTSecretKeyForProductionAndDev
jwt.expiration-hours=24

# JSON formatting
spring.jackson.serialization.indent-output=true

